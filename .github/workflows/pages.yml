# Publishes every branch to one Pages site:
#
#   main            -> https://toddclaw.github.io/Hsk_chat/
#   any other       -> https://toddclaw.github.io/Hsk_chat/preview/<branch>/
#
# so the public page is always main and testing a branch never touches it.
# Pages must be set to deploy from the `gh-pages` branch, root folder — once.
name: Publish

on:
  push:
    branches: ["**"]
  delete:

permissions:
  contents: write

concurrency:
  group: pages-publish          # one writer at a time; gh-pages is a shared branch
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same suites the pre-commit hook runs. A branch that fails them is
      # not worth previewing, and main must never publish red.
      - name: Test
        run: sh test/run.sh

      - name: Work out where this branch publishes
        id: dest
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          if [ "$branch" = "main" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "url=" >> "$GITHUB_OUTPUT"
          else
            # slashes are legal in branch names but not wanted in a path
            safe=$(printf '%s' "$branch" | tr '/' '-')
            echo "dir=preview/$safe" >> "$GITHUB_OUTPUT"
            echo "url=preview/$safe/" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to gh-pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add ../site origin/gh-pages
          else
            git worktree add --detach ../site
            (cd ../site && git checkout --orphan gh-pages && git rm -rf . >/dev/null 2>&1 || true)
          fi

          target="../site/${{ steps.dest.outputs.dir }}"

          # Clear the destination first so deleted files really disappear. When
          # publishing main that is the site root, minus preview/ -- otherwise a
          # push to main would wipe every branch's preview.
          if [ "${{ steps.dest.outputs.dir }}" = "." ]; then
            find ../site -mindepth 1 -maxdepth 1 ! -name .git ! -name preview -exec rm -rf {} +
          else
            rm -rf "$target"
          fi
          mkdir -p "$target"

          # An explicit list, not an exclusion list: adding a file to the repo
          # should never publish it by accident. test/release.test.js fails if
          # this drifts from what index.html actually loads.
          for f in $(cat .github/publish-files); do
            [ -e "$f" ] && cp -R "$f" "$target/"
          done
          touch ../site/.nojekyll

          cd ../site
          git add -A
          git diff --quiet --cached || git commit -m "Publish ${GITHUB_REF#refs/heads/} (${GITHUB_SHA::7})"
          git push origin HEAD:gh-pages

      - name: Say where it went
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${{ steps.dest.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Update latest preview redirect
        if: steps.dest.outputs.dir != '.'
        run: |
          cd ../site
          # Update recent-branches.json
          if [ -f "preview/recent-branches.json" ]; then
            branches=$(cat preview/recent-branches.json)
          else
            branches="[]"
          fi
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          new_entry="{\"branch\":\"$branch\",\"safeName\":\"$safe\",\"timestamp\":\"$timestamp\",\"commit\":\"${GITHUB_SHA::7}\"}"
          # Add new entry, keep last 10, sort by timestamp
          echo "$branches" | python3 -c "
import sys, json
data = json.load(sys.stdin)
new = json.loads('$new_entry')
# Remove any existing entry for this branch
data = [e for e in data if e.get('branch') != '$branch']
# Add new entry at the end (most recent)
data.append(new)
# Keep last 10
data = data[-10:]
print(json.dumps(data, indent=2))
" > preview/recent-branches.json.tmp
          mv preview/recent-branches.json.tmp preview/recent-branches.json
          
          # Get latest branch name for redirect
          latest_safe=$(python3 -c "import json; data=json.load(open('preview/recent-branches.json')); print(data[-1]['safeName'] if data else '')")
          latest_branch=$(python3 -c "import json; data=json.load(open('preview/recent-branches.json')); print(data[-1]['branch'] if data else '')")
          latest_commit=$(python3 -c "import json; data=json.load(open('preview/recent-branches.json')); print(data[-1]['commit'] if data else '')")
          
          if [ -n "$latest_safe" ]; then
            # Generate redirect index.html
            cat > preview/index.html << EOF
<!DOCTYPE html>
<meta charset="utf-8">
<title>HSK Chat Preview</title>
<meta http-equiv="refresh" content="0;url=./${latest_safe}/">
<meta name="robots" content="noindex">
<style>
  body{background:#0f1317;color:#e8edf2;font:16px/1.5 system-ui,sans-serif;padding:40px}
  .banner{background:#2a343e;border:1px solid #5a4a22;border-radius:10px;padding:20px;margin-bottom:20px}
  .warning{color:#ffd479}
  a{color:#6aa9ff}
  code{background:#1a2026;padding:2px 6px;border-radius:4px}
</style>
<div class="banner">
  <b class="warning">⚠ Preview Build</b> — This is a preview from a feature branch, not production.
  <div>Branch: <code>${latest_branch}</code></div>
  <div>Commit: <code>${latest_commit}</code></div>
  <p>Redirecting to preview... <a href="./${latest_safe}/">Click here if not redirected</a></p>
  <p><a href="./">View all previews</a> | <a href="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/">Go to production</a></p>
</div>
EOF
          fi
          
          git add -A
          git diff --quiet --cached || git commit -m "Update latest preview redirect ($branch)"
          git push origin HEAD:gh-pages

      - name: Verify GitHub Pages deployment
        run: |
          echo "Waiting 30 seconds for GitHub Pages to process..."
          sleep 30
          
          base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          
          if [ "${{ steps.dest.outputs.dir }}" = "." ]; then
            # Production deployment - check main page
            test_url="$base_url/"
          else
            # Preview deployment - check preview page
            test_url="$base_url/${{ steps.dest.outputs.url }}"
          fi
          
          echo "Verifying deployment at: $test_url"
          
          # Try up to 3 times with exponential backoff
          for i in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$test_url" || echo "000")
            if [ "$status" = "200" ]; then
              echo "✓ Deployment verified successfully (attempt $i)"
              echo "url=$test_url" >> "$GITHUB_STEP_SUMMARY"
              echo "status=$status" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $i: Got status $status, retrying in $((i * 10)) seconds..."
            sleep $((i * 10))
          done
          
          echo "✗ Deployment verification failed after 3 attempts"
          echo "Expected URL: $test_url"
          echo "Last status: $status"
          exit 1

  cleanup:
    # Deleting a branch takes its preview with it, so they do not pile up.
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - name: Remove the preview and update redirect
        run: |
          safe=$(printf '%s' "${{ github.event.ref }}" | tr '/' '-')
          if [ -d "preview/$safe" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -r --quiet "preview/$safe"
            
            # Update recent-branches.json - remove deleted branch
            if [ -f "preview/recent-branches.json" ]; then
              python3 -c "
import json
with open('preview/recent-branches.json') as f:
    data = json.load(f)
data = [e for e in data if e.get('branch') != '${{ github.event.ref }}']
with open('preview/recent-branches.json', 'w') as f:
    json.dump(data, f, indent=2)
"
            fi
            
            # Regenerate index.html with new latest
            latest_safe=$(python3 -c "import json; data=json.load(open('preview/recent-branches.json')); print(data[-1]['safeName'] if data else '')" 2>/dev/null || echo "")
            latest_branch=$(python3 -c "import json; data=json.load(open('preview/recent-branches.json')); print(data[-1]['branch'] if data else '')" 2>/dev/null || echo "")
            latest_commit=$(python3 -c "import json; data=json.load(open('preview/recent-branches.json')); print(data[-1]['commit'] if data else '')" 2>/dev/null || echo "")
            
            if [ -n "$latest_safe" ]; then
              cat > preview/index.html << EOF
<!DOCTYPE html>
<meta charset="utf-8">
<title>HSK Chat Preview</title>
<meta http-equiv="refresh" content="0;url=./${latest_safe}/">
<meta name="robots" content="noindex">
<style>
  body{background:#0f1317;color:#e8edf2;font:16px/1.5 system-ui,sans-serif;padding:40px}
  .banner{background:#2a343e;border:1px solid #5a4a22;border-radius:10px;padding:20px;margin-bottom:20px}
  .warning{color:#ffd479}
  a{color:#6aa9ff}
  code{background:#1a2026;padding:2px 6px;border-radius:4px}
</style>
<div class="banner">
  <b class="warning">⚠ Preview Build</b> — This is a preview from a feature branch, not production.
  <div>Branch: <code>${latest_branch}</code></div>
  <div>Commit: <code>${latest_commit}</code></div>
  <p>Redirecting to preview... <a href="./${latest_safe}/">Click here if not redirected</a></p>
  <p><a href="./">View all previews</a> | <a href="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/">Go to production</a></p>
</div>
EOF
            else
              # No branches left, remove the index
              rm -f preview/index.html preview/recent-branches.json
            fi
            
            git add -A
            git commit -m "Remove preview for deleted branch ${{ github.event.ref }} and update redirect"
            
            # Rebase on top of any concurrent main publish so we never
            # overwrite it — see Hsk_chat#24 for the race source.
            git fetch origin gh-pages --depth=1                  # freshen ref
            git rebase origin/gh-pages                           # stack on any new commits
            git push origin HEAD:gh-pages
            
            # Verify the cleanup was deployed
            echo "Waiting 20 seconds for GitHub Pages to process cleanup..."
            sleep 20
            
            base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
            preview_url="$base_url/preview/"
            
            echo "Verifying preview index at: $preview_url"
            status=$(curl -s -o /dev/null -w "%{http_code}" "$preview_url" || echo "000")
            if [ "$status" = "200" ]; then
              echo "✓ Preview index verified successfully"
            else
              echo "⚠ Preview index returned status $status (may be OK if no previews remain)"
            fi
          fi
