# Publishes every branch to one Pages site:
#
#   main            -> https://toddclaw.github.io/Hsk_chat/
#   any other       -> https://toddclaw.github.io/Hsk_chat/preview/<branch>/
#
# so the public page is always main and testing a branch never touches it.
# Pages must be set to deploy from the `gh-pages` branch, root folder — once.
#
# /preview/ lists every live preview and marks the one just published; it does
# not redirect, so the list is what you land on and the branch is your choice.
# That index and the pruning of dead previews are both done by one reconcile
# against `git ls-remote`, run on every publish and every delete — see
# .github/scripts/sync-previews.py for why it asks git rather than keeping a
# list of what it published before.
name: Publish

on:
  push:
    branches: ["**"]
  delete:

permissions:
  contents: write

# Deliberately NOT one workflow-level group. GitHub keeps only ONE run pending
# per group, so a newly queued run cancels the one already waiting -- and a
# merge fires `push` and `delete` within about two seconds of each other. With
# both events in one group, deleting the merged branch cancelled the pending
# publish of main and the deploy was silently skipped; PR #44 sat on main for
# nine versions while the live site served v105, the run showing as "cancelled"
# rather than failed. The two jobs write gh-pages with different strategies --
# publish pushes once, cleanup retries -- so they get a group each.
jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One publish at a time; gh-pages is a shared branch and the push below is
    # a single attempt with no retry. A displaced pending push costs at worst a
    # stale branch preview: main republishes its whole state every time, so a
    # lost run on main is repaired by the next push to it.
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # The same suites the pre-commit hook runs. A branch that fails them is
      # not worth previewing, and main must never publish red.
      - name: Test
        run: sh test/run.sh

      - name: Work out where this branch publishes
        id: dest
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          # Every value another step needs goes through $GITHUB_OUTPUT. A plain
          # shell variable does not survive the end of this `run:` -- each step
          # is its own process -- and the preview redirect step used to read
          # $branch and $safe here, getting empty strings and writing a
          # recent-branches.json entry with no branch name in it.
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ "$branch" = "main" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "url=" >> "$GITHUB_OUTPUT"
            # main has no preview of its own, so it names no redirect target.
            echo "preview_branch=" >> "$GITHUB_OUTPUT"
          else
            # slashes are legal in branch names but not wanted in a path
            safe=$(printf '%s' "$branch" | tr '/' '-')
            echo "safe=$safe" >> "$GITHUB_OUTPUT"
            echo "dir=preview/$safe" >> "$GITHUB_OUTPUT"
            echo "url=preview/$safe/" >> "$GITHUB_OUTPUT"
            echo "preview_branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to gh-pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add ../site origin/gh-pages
          else
            git worktree add --detach ../site
            (cd ../site && git checkout --orphan gh-pages && git rm -rf . >/dev/null 2>&1 || true)
          fi

          target="../site/${{ steps.dest.outputs.dir }}"

          # Clear the destination first so deleted files really disappear. When
          # publishing main that is the site root, minus preview/ -- otherwise a
          # push to main would wipe every branch's preview.
          if [ "${{ steps.dest.outputs.dir }}" = "." ]; then
            find ../site -mindepth 1 -maxdepth 1 ! -name .git ! -name preview -exec rm -rf {} +
          else
            rm -rf "$target"
          fi
          mkdir -p "$target"

          # An explicit list, not an exclusion list: adding a file to the repo
          # should never publish it by accident. test/release.test.js fails if
          # this drifts from what index.html actually loads.
          for f in $(cat .github/publish-files); do
            [ -e "$f" ] && cp -R "$f" "$target/"
          done
          touch ../site/.nojekyll

          # Prune previews whose branch is gone and rewrite /preview/, in the
          # same commit as the publish above -- one commit and one push, so
          # there is no second push to lose a race with. This runs on a push to
          # main too: main publishes no preview, but it is the most frequent
          # event on the repo and so the most reliable moment to notice that a
          # branch was deleted while its cleanup run was cancelled.
          git ls-remote --heads origin | sed 's#.*refs/heads/##' > /tmp/live-branches
          python3 .github/scripts/sync-previews.py \
            ../site/preview /tmp/live-branches \
            "${{ github.repository_owner }}" "${{ github.event.repository.name }}" \
            "${{ steps.dest.outputs.preview_branch }}"

          cd ../site
          git add -A
          git diff --quiet --cached || git commit -m "Publish ${{ steps.dest.outputs.branch }} (${GITHUB_SHA::7})"
          git push origin HEAD:gh-pages

      - name: Say where it went
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${{ steps.dest.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify GitHub Pages deployment
        run: |
          echo "Waiting 30 seconds for GitHub Pages to process..."
          sleep 30

          base_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

          if [ "${{ steps.dest.outputs.dir }}" = "." ]; then
            test_url="$base_url/"
          else
            test_url="$base_url/${{ steps.dest.outputs.url }}"
          fi

          echo "Verifying deployment at: $test_url"

          for i in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$test_url" || echo "000")
            if [ "$status" = "200" ]; then
              echo "✓ Deployment verified successfully (attempt $i)"
              echo "url=$test_url" >> "$GITHUB_STEP_SUMMARY"
              echo "status=$status" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $i: Got status $status, retrying in $((i * 10)) seconds..."
            sleep $((i * 10))
          done

          echo "::error::Deployment verification failed after 3 attempts"
          echo "Expected URL: $test_url"
          echo "Last status: $status"
          exit 1

  cleanup:
    # Deleting a branch takes its preview with it.
    #
    # Best-effort by design. This group too keeps only ONE run pending, so
    # deleting several branches at once cancels all but the last -- which is
    # survivable only because the reconcile is idempotent and derives everything
    # from the live branch list, so whichever run does survive removes every
    # orphan, not just its own. A dropped run costs a delay, not a preview that
    # outlives its branch for ever. What it must never cancel is a publish,
    # hence the separate group.
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-cleanup
      cancel-in-progress: false
    steps:
      # main, not gh-pages: this job needs the script, which lives in the
      # source tree. Checking out gh-pages here is what broke the old version
      # of this job -- it then cd'd into ../site, a worktree only the publish
      # job ever creates, so `[ -d preview/$safe ]` was false every time and
      # the whole body silently did nothing.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Reconcile previews against the branches that still exist
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages --depth=1
          git worktree add ../site origin/gh-pages
          if [ ! -d ../site/preview ]; then
            echo "no previews published yet, nothing to reconcile"
            exit 0
          fi

          git ls-remote --heads origin | sed 's#.*refs/heads/##' > /tmp/live-branches
          reconcile() {
            python3 .github/scripts/sync-previews.py \
              ../site/preview /tmp/live-branches \
              "${{ github.repository_owner }}" "${{ github.event.repository.name }}"
            git -C ../site add -A
            git -C ../site diff --quiet --cached ||
              git -C ../site commit -m "Reconcile previews after ${{ github.event.ref }} was deleted"
          }

          reconcile
          # A concurrent publish may land first. Redo the reconcile on top of
          # whatever it wrote rather than rebasing: the result is a function of
          # the live branch list, so recomputing it is always correct and never
          # conflicts. See Hsk_chat#24 for the race this replaces.
          for attempt in 1 2 3; do
            if git -C ../site push origin HEAD:gh-pages; then
              exit 0
            fi
            echo "push $attempt lost a race; refetching and redoing the reconcile"
            git fetch origin gh-pages --depth=1
            git -C ../site reset --hard origin/gh-pages
            [ -d ../site/preview ] || exit 0
            reconcile
          done
          echo "::error::could not push the preview reconcile after 3 attempts"
          exit 1
