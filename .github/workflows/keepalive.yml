# Supabase's free tier pauses a project after 7 days with no database
# activity (dashboard visits and cached reads don't count) -- a quiet week
# would otherwise leave sync silently stopped until someone clicks "resume"
# in the dashboard. This pings a dedicated table every few days, well inside
# that window, using a real write so it counts as activity.
#
# One-time setup (see README.md's "Cloud sync" section):
#   1. Run db/schema.sql in the Supabase project -- it creates the
#      `_keepalive` table this workflow writes to, with RLS enabled and no
#      policies, so only the service_role key below can touch it.
#   2. Add two repository secrets (Settings -> Secrets and variables ->
#      Actions): SUPABASE_URL (the project's URL) and
#      SUPABASE_SERVICE_ROLE_KEY (Project Settings -> API -- the
#      service_role key, NOT the anon key; this one bypasses RLS and must
#      never appear in the app's client-side code).
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 */3 * *"   # every 3 days, comfortably inside the 7-day pause window
  workflow_dispatch:         # manual "Run workflow" button, for testing this setup

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert a keepalive row
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets are not set yet -- skipping." >&2
            echo "See README.md's Cloud sync section to finish setup." >&2
            exit 1
          fi
          curl -sS -f -X POST "$SUPABASE_URL/rest/v1/_keepalive" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"id\": 1, \"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
